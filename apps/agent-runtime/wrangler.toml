# PAYLOAD_CLASSES_ENFORCER / TREASURY_SPEND_POLICY are generation-3 contracts this estate does not run (CONTRACTS_GENERATION = "1").
ONTOLOGY_TERM_REGISTRY = "0xA8Eaa2415EBF4250B041abD1561A3756CeEa0A6C"
PAYMENT_ENFORCER = "0x07fA0aE59FdE4B7ce8962d6fE7a1d648ec3DD5CE"
MOCK_USDC = "0xdaE09066A2cc32f6203605619137dcF01A9B49Ae"
# The SA THIS agent acts as when it executes under a mandate — custodied by the interactions-session key.
# Separate from INTERACTIONS_SERVICE_SA (which existing grants name; changing that would stale them).
HARNESS_AGENT_SA = "0xD34c3Fbc89706dd57d426546DCEBD3bA926eDE35"

[env.faithnet.durable_objects]
bindings = [
  { name = "SESSIONS", class_name = "SessionStoreDO" },
  { name = "A2A_TASKS", class_name = "A2aTaskDO" },
  { name = "INTERACTIONS", class_name = "InteractionsDO" },
  { name = "HUDDLES", class_name = "HuddleRoomDO" },
  { name = "PROVIDER_METER", class_name = "ProviderMeterDO" },
  # Spec 415 A5 — the Lab's experiments, one object per plan id (experiment-do.ts).
  { name = "EXPERIMENTS", class_name = "ExperimentDO" },
  # GC 2026-10-20 - the relay queue: one sender for the relay account, batching userOps (relay-queue.ts).
  # Inert until RELAY_QUEUE=on.
  { name = "RELAY_QUEUE_DO", class_name = "RelayQueueDO" },
  { name = "SA_BUDGET", class_name = "SmartAgentBudgetDO", script_name = "demo-mcp-faithnet" },
  # Spec 400 W1c — one runtime Container per member, named by the member's agent address.
  { name = "RUNTIME", class_name = "RuntimeContainer" },
]

# Spec 400 W1c — the runtime member's Container: Node + `ap runtime serve` + the ACP agent, next to the Worker.
# Image built by wrangler from ./runtime-container (run `node runtime-container/build.mjs` first — it packs the kit
# into ./runtime-container/tarballs). Per-member secrets: AP_RUNTIME_RECORD_<NAME> / AP_RUNTIME_KEY_<NAME>
# (`ap runtime export`); AP_RUNTIME_AGENT picks the agent (acp-stub-agent | claude-code-acp).
[[env.faithnet.containers]]
class_name = "RuntimeContainer"
image = "./runtime-container/Dockerfile"
max_instances = 3
instance_type = "basic"

# Spec 400 W1c — the wake queue: produced after a message is ADMITTED into a member that declared a host; consumed
# by this same Worker, which POSTs /wake to the member's Container (or URL). No content, no authority in a message.
# Spec 406 W1 — THE OPERATOR VIEW'S INDEX: one row per finished run (numbers and ids, never words), a serving-plane
# projection rebuilt from the run records on request. Not the evidence: the record, the receipts and the PROV bundle are.
[[env.faithnet.d1_databases]]
binding = "OPS"
database_name = "harness-ops-faithnet"
database_id = "dbdd6b71-f008-4a34-bb01-1cb195021993"

[[env.faithnet.queues.producers]]
binding = "RUNTIME_WAKE"
queue = "runtime-wake-faithnet"

# Spec 413 — shelf hints (`{owner, entryId}`, no content) after a Library act; consumed by demo-discovery-indexer-faithnet,
# which re-reads the owner's public lane and verifies the release before projecting anything.
# `wrangler queues create shelf-index-faithnet` once.
[[env.faithnet.queues.producers]]
binding = "SHELF_INDEX"
queue = "shelf-index-faithnet"

[[env.faithnet.queues.consumers]]
queue = "runtime-wake-faithnet"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 2
max_concurrency = 2

[[env.faithnet.kv_namespaces]]
binding = "BRIDGE_NONCES"
id = "f2febbc2930541f7860114a847f387de"
[[env.faithnet.kv_namespaces]]
binding = "SUBJECT_SA_MAP"
id = "b8429f3ce1664857a926c8e5f2282494"
[[env.faithnet.kv_namespaces]]
binding = "FED_TOKENS"
id = "7aeeedfa2a7043208193bd57bfb6f63d"

# spec 347 §8.1 — serving-plane cache of RELEASED A2A Agent Cards (the record is the vault; this is a rebuild).
[[env.faithnet.kv_namespaces]]
binding = "RELEASED_CARDS"
id = "7212055cf68d460aac90ac54b0bee5c8"

[[env.faithnet.services]]
binding = "MCP"
service = "demo-mcp-faithnet"

# The Ask reads the PUBLIC agent directory through discovery (ADR-0040) — read-only, no GraphDB credential
# here, and no write path: the indexer is the KB's only writer. Bound to the FAITHNET discovery worker on
# purpose: the production one projects Base Sepolia, and answering a faithnet question from another chain's
# index is a wrong answer delivered confidently.
[[env.faithnet.services]]
binding = "DISCOVERY_MCP"
service = "demo-discovery-mcp-faithnet"

# Spec 415 A4 — the skills corpus: an instruction skill's body, read by the digest its playbook tool names.
[[env.faithnet.services]]
binding = "SKILLS_MCP"
service = "skills-mcp"

