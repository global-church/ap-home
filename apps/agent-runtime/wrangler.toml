# Cloudflare Worker config for demo-a2a.
#
# Local dev:  wrangler dev (reads .dev.vars for secrets + Anvil contract addrs)
# Production: wrangler deploy (uses [vars] + secrets set via `wrangler secret put`)
#
# Durable Object SESSIONS holds the SessionStore (one global instance for the
# demo; production would shard per-user via idFromName(walletAddress)).
#
# nodejs_compat is on so our @agenticprimitives/* packages can keep using
# `process.env`, `Buffer`, and the Web-Crypto interfaces they already use.

name = "demo-a2a"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
local_protocol = "http"

[durable_objects]
bindings = [
  { name = "SESSIONS", class_name = "SessionStoreDO" },
  { name = "A2A_TASKS", class_name = "A2aTaskDO" },
  { name = "INTERACTIONS", class_name = "InteractionsDO" },
  { name = "HUDDLES", class_name = "HuddleRoomDO" },
  { name = "PROVIDER_METER", class_name = "ProviderMeterDO" },
  # Spec 415 A5 — the Lab's experiments, one object per plan id (experiment-do.ts).
  { name = "EXPERIMENTS", class_name = "ExperimentDO" },
  # GC 2026-10-20 - the relay queue: one sender for the relay account, batching userOps (relay-queue.ts).
  # Inert until RELAY_QUEUE=on.
  { name = "RELAY_QUEUE_DO", class_name = "RelayQueueDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionStoreDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["A2aTaskDO"]

[vars]
RPC_URL = "http://127.0.0.1:8545"
CHAIN_ID = "31337"
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"
MCP_URL = "http://127.0.0.1:8788"
# spec 329 W2 — discovery reach for find_members in local dev (base-URL transport; production uses
# the DISCOVERY_MCP service binding below). Unreachable ⇒ routing degrades to the un-enriched
# eligible set (fail-open to fewer signals, never to more candidates).
DISCOVERY_MCP_BASE = "http://127.0.0.1:8790"

# Contract addresses + secrets live in .dev.vars (gitignored) for local dev.

[[migrations]]
tag = "v3"
new_sqlite_classes = ["InteractionsDO"]

# Spec 378 — one huddle room per scope key: the current call's run and its provider binding (serving-plane).
[[migrations]]
tag = "v4"
new_sqlite_classes = ["HuddleRoomDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ProviderMeterDO"]

# Spec 400 W1c — the runtime member's Container (a DO per member instance; the Container class extends DurableObject).
[[migrations]]
tag = "v6"
new_sqlite_classes = ["RuntimeContainer"]

# Spec 415 A5 — the Lab's experiment object.
[[migrations]]
tag = "v7"
new_sqlite_classes = ["ExperimentDO"]

# GC 2026-10-20 - the relay queue object (relay-queue.ts).
[[migrations]]
tag = "v8"
new_sqlite_classes = ["RelayQueueDO"]

# ── FAITHNET (Azure faithchain 34348) — gcp-kms custody, Home on faithnet.me, backend on faithnet.io ──
[env.faithnet]
name = "demo-a2a-faithnet"
workers_dev = true

# Perf (2026-10-02) — keep the cold read chain warm. Every 2 minutes the `scheduled` handler reads each
# WARM_AGENTS agent's playbook + type through the internal vault path an ask starts with, so the owner's
# InteractionsDO, the demo-mcp vault and the faithchain RPC are resident when a real user arrives instead
# of paying the cold-start on the first load ("the first load takes a minute"). A no-op if WARM_AGENTS is
# empty. Declared IN wrangler (in-band) so a deploy does not drop it.
[env.faithnet.triggers]
crons = ["*/2 * * * *"]

[[env.faithnet.routes]]
pattern = "a2a.faithnet.io"
custom_domain = true

# One wildcard for the whole agent estate, present and future. Safe HERE and not on faithnet.io because this
# zone hosts nothing but agents — the same shape production uses on impact-agent.io.
#
# ROUTE, not custom domain: wrangler refuses a wildcard custom domain ("Wildcard operators (*) are not allowed
# in Custom Domains"), though the API accepts one. A wildcard custom domain therefore cannot be declared here,
# and anything not declared here is DELETED by the next deploy — with its DNS record.
#
# So DNS belongs to the zone, not to a Worker trigger: the zone needs a proxied `*` record, and this declared
# route does the serving. Until that record exists the estate is held up by an API-created `*.faithnet.ai`
# custom domain, which a deploy of this Worker WILL remove — add the record before the next deploy.
[[env.faithnet.routes]]
pattern = "*.faithnet.ai/*"
zone_name = "faithnet.ai"

# Spec 369 — Workers AI for HEARING (`/harness/hear`, Whisper). Audio is processed in memory and discarded.
[env.faithnet.ai]
binding = "AI"

[env.faithnet.vars]
# Spec 426 — executor-invoke operator config: a JSON map `executor-ref → { url, client }`. The one generic
# invoker resolves a capability's `invoke.executor` here (fail-closed; an unknown ref refuses). field-circles =
# the engage/field-a2a executor (its /a2a admits the `field-app` client; reached by custom domain, not
# workers.dev, which would 1042). Absent ⇒ every invoke capability refuses.
EXECUTORS = '{"field-circles":{"url":"https://field-a2a.faithnet.io","client":"field-app"}}'
# Spec 377 / provider-outage — the exact page for THIS estate's Gemini failure mode (a monthly spend cap,
# not a rate limit): the error links here, and whoever runs the Home raises it here. Overrides the generic default.
ORCHESTRATION_GEMINI_BILLING_URL = "https://ai.studio/spend"
# Perf (2026-10-02) — the agents the `scheduled` cron keeps warm (comma-separated SAs): the demo persons and
# orgs a visitor lands on first. Read-only, credential-free. Extend as the demo roster people actually hit
# grows; keep it small (each agent is two reads per tick). nathan.me + "Northern Colorado Field — Game Night".
WARM_AGENTS = "0x1dba4a27c53d7babda99513080223fb3bfc4bad1,0x8e32c713f44c7747d97a589522806a8e1dd810fb"
# Spec 408 — the contract generation this estate runs: "1" = the contracts deployed today (raw approved hashes,
# 32-byte digest-binding args, anchorOf(digest)). Becomes "2" only with a deployments file that says so.
CONTRACTS_GENERATION = "1"
# Spec 415 A4 — this is a COMPARISON estate: the `variant` knob on /harness/ask is open to an agent's own steward, and
# runs by test personas may be exported to an eval store inside a capture window. Never on a production estate.
EVAL_CAPTURE = "on"
# Spec 400 W1c — the ACP agent the runtime Container spawns: the deterministic stub (the live gate's) or
# `claude-code-acp` (Claude Code; the operator's ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN as secrets).
AP_RUNTIME_AGENT = "acp-stub-agent"
# Spec 397 W2 — the ARD registry this deployment's agents find other agents in.
ARD_REGISTRY_ORIGIN = "https://discovery-a2a.faithnet.io"
# Spec 365 — the zones whose inbound mail this Worker routes (`<handle>@<zone>` → the naming service).
EMAIL_ZONES = "faithnet.me"
# Outbound mail goes out as this address (its zone is onboarded to Cloudflare Email Sending).
EMAIL_FROM = "invites@faithnet.ai"
EMAIL_FROM_NAME = "faithnet"
# spec 346 migration — the faithnet estate moved persons to `.me` (2026-08-29); legacy `.impact` homes still resolve.
AGENT_NAME_PARENTS = "me,impact"
CHAIN_ID = "34348"
# Spec 377 — ordered allowlist; first = default. Needs a key secret per listed provider
# (`wrangler secret put GROQ_API_KEY --env faithnet`). See the [env.production.vars] comment for the rules.
# 2026-09-09: Anthropic default (the user raised the account's usage limit); Groq stays OFFERED in the picker.
# Groq alone ("groq") turns Anthropic off; Groq first ("groq,anthropic") is the fallback while a limit bites. Groq's free plan meters 8k tokens/minute per model: the planner prompt is fitted
# to `ORCHESTRATION_GROQ_PROMPT_BUDGET` (default 6500, see plannerPromptBudget) and a 429's retry-after <=60s is
# waited out once - roughly one ask a minute on it until the Groq plan is upgraded. Listing "groq" alone turns
# Anthropic off (its key secret stays set either way).
# 2026-09-10: the Anthropic account is OUT OF CREDIT (HTTP 400 "credit balance is too low", surfaced by the spec 387 flow trace) — Groq
# leads until credits are added; Anthropic stays offered. Restore "anthropic,groq" when billing is fixed.
# 2026-09-10 — a THIRD provider between the free tier and Haiku: OpenAI's gpt-5-mini (a quarter of Haiku's input price).
# The offer is walked cheapest-first by the route; anthropic is reached only when named or when nothing cheaper carries the call.
# OPENAI_API_KEY is a secret (`wrangler secret put`), never a --var; ORCHESTRATION_OPENAI_MODEL / _PROMPT_BUDGET / _TPM are optional.
# 2026-09-10 (later): the OpenAI account has NO CREDITS (HTTP 429 credit_balance_exhausted on the first routed planner call) and the
# route surfaces that, never skips it (ADR-0013) — so openai is OFF the offer until credits are added. Flip to "groq,openai,anthropic".
# 2026-09-15 — xAI's Grok is the ONLY offered model (user's decision): a Grok failure is an error the person sees, never a
# quiet hand-off to another provider (ADR-0013). Re-offer groq/anthropic by listing them again ("xai,groq,anthropic").
# XAI_API_KEY is a secret (`wrangler secret put XAI_API_KEY --env faithnet`).
# 2026-09-20 — the xAI team ran out of credits (HTTP 403 "used all available credits or reached its monthly spending
# limit"), which failed every Ask turn on the estate. Gemini (8aba978e: gemini-3.5-flash-lite plans, gemini-3.5-flash
# composes) is now the ONLY offered model, the same one-provider stance as 09-15. GEMINI_API_KEY is a secret
# (`wrangler secret put GEMINI_API_KEY --env faithnet`). Re-offer Grok with "gemini,xai" once its credits are back.
# 2026-09-26 — Anthropic offered SECOND, so a comparison may name it (spec 415: the selection judge on Gemini vs on Claude
# Haiku, one component changed). Gemini is first and unmetered, so every call that names no provider still goes to Gemini;
# Anthropic carries only a turn that names it. (Until today the structured call fell through to Claude whatever the route
# said — every judgment and skill.apply call ran on Haiku while this line read "gemini"; context-wiring now refuses that.)
ORCHESTRATION_LLM = "gemini,anthropic"
# Spec 416 §4f — the fast judge picks among a playbook's instruction skills before the planner (one light-model call over
# ontology cards + the typed reading; "none" hands the ask to the planner). Only agents with instruction skills are affected.
SKILL_SELECTION_DEFAULT = "selective"
# Spec 416 §4h — the asker's own recent skills here (+ memory at their own agent) in the reading on REAL asks (ledger: +11/−0, p = 0.001).
SKILL_SELECTION_ASKER_CONTEXT = "full"
# Spec 418 §11 — the plan around the pick: one choice among the plans the ontology allows (ledger: chain panel 4 +12/−0).
SKILL_SELECTION_PLAN = "choice"
# Spec 418 — the stronger Gemini model a side-by-side compares long answers against (never a default without a ledger verdict).
ORCHESTRATION_GEMINI_STRONG_MODEL = "gemini-3.1-pro-preview"
# Spec 418 D5 — the asker's records from the colo cache; the conversation write after the reply (ledger: −63% ask time, same quality).
OPS_RECORDS_DEFAULT = "cached"
# Spec 418 A1 — the skill answer streams (adopted 2026-09-28 on stream-a1c: first words 11.8 s vs the whole answer at 23.3 s; tokens and outcome unchanged).
ANSWER_STREAM_DEFAULT = "on"
# Spec 418 A1 — the skill answer thinks at MINIMAL effort (adopted 2026-09-28 on effort-a1: first words in-step 3.8 → 0.8 s,
# 8/8, p = 0.008; from the ask 12.9 → 4.9 s; side by side minimal preferred 5–2–1).
# Re-adopted 2026-09-28 on effort-c4r2 (chain panel 4, two repeats, 26 pairs): outcome check 0.753 vs 0.748 (6 better,
# 8 worse, 12 same; p = 0.79) — the one-repeat drop on effort-c4 was per-case noise; first words 7.1 → 4.7 s, in-step 3.3 → 0.8 s.
SKILL_ANSWER_MODEL_DEFAULT = "minimal"
# 2026-10-01 — A PLAN WITH A REQUIRED INPUT MISSING (`skill-selection/hold`): `ask` (the skill is told "ask for it rather
# than invent it" and answers with a question) or `skeleton` (the skill runs anyway: each output's full structure, filled
# where the request gave the facts, every gap a named [MISSING: …] placeholder, the three to five questions first; the run
# records `skillStage: 'skeleton'`). Measured 2026-10-01 (CIL Commons held-out 8, Gemini answering, Haiku judging): the
# harness is +0.07 over a bare model on delivered classes and trails it on exactly these holds, because the outcome check
# credits a filled-in template and a bare question scores 0. NOT SET: `ask` until the Lab measures the skeleton arm.
# SKILL_HOLD_DEFAULT = "skeleton"
# 2026-10-02 — A CHAIN'S TERMINAL STEP PROCEEDS (`plan/chain-proceed`): `off` or `on`. When the plan is a chain (a producer
# step whose output the terminal step consumes) and nothing is missing, `on` puts a proceed-anyway instruction in front
# of the TERMINAL step's question only: full output now, assumptions on top, every unverified fact a [VERIFY: …] or
# [MISSING: …] placeholder, never an invented figure/funder/deadline/quote, the three to five completing facts last; the
# run records `chainProceed: true`. Measured 2026-10-01/02 (CIL Commons held-out 8 + chain panel 4, three repeats, Haiku
# judging): the grant chain scored 0.35–0.46 in every arm because the drafter paused at its Stage 1 soft gate ("verify
# the funder first") though the person asked for the draft in the same sentence. A held plan stays the hold's (skeleton
# wins). NOT SET: `off` until the Lab measures the `on` arm.
# PLAN_CHAIN_PROCEED_DEFAULT = "on"
# 2026-10-01 — THE OUTCOME CHECK'S REPEATS (`quality/judge-repeats`): the same answer judged N times, score and classes
# averaged, `outcomeCheck.spread` (max − min) and `.repeats` on the trace. The judge moved 0.025 (Haiku; Gemini far more)
# between two runs of the same check on a fixed answer. NOT SET: one call until the Lab measures whether two steady it.
# QUALITY_JUDGE_REPEATS_DEFAULT = "2"
# Spec 420 §2 — goal regression over situations on every ask (a comparison names its own arm): the room's roster and the
# asker's standing check each act's preconditions before any signature is asked for.
PLAN_REGRESSION_DEFAULT = "on"
# Spec 420 §10 — names resolve in context (the room's roster · household · a shared context · dealings) before asking.
# ADOPTED 2026-09-28 on the ledger (resolve-context: fixed 6, broken 0, exact McNemar p = 0.031).
RESOLVE_CONTEXT_DEFAULT = "on"
# Spec 421 W1 — continue from what was read (read → act chains; whose words each argument came from is on the card).
# ADOPTED 2026-09-29 on the ledger (plan-continuation: set 9 fixed 7, broken 0, p = 0.016; adversarial 16/16; panel unchanged).
PLAN_CONTINUATION_DEFAULT = "on"
# Spec 388 — the cheapest OFFERED provider that carries each call, decided before the request from the prompt estimate, the
# per-request budget and this minute's spend; recorded on the trace with its reason. A route, never a fallback (ADR-0013).
ORCHESTRATION_ROUTE = "budget"
ORCHESTRATION_GROQ_TPM = "8000"
# 2026-09-10 — the cheaper Anthropic model, named here so a targeted deploy keeps it (the package default is the same).
ORCHESTRATION_MODEL = "claude-haiku-4-5-20251001"
# Spec 387 W2 — a composition over evidence (a six-week study with a link per item) needs more than the composers' 700-token default.
COMPOSER_MAX_TOKENS = "2400"
ASSISTANT_RATE_MAX = "60"
ASSISTANT_RATE_WINDOW_MS = "600000"
GATHER_RECORD_CLIP = "60000"
GATHER_DIGEST_MAX = "120000"
PUBLIC_GRAPH_URL = "https://graphdb.agentkg.io/repositories/gc-public"
SA_BUDGET_LIMIT_UNITS = "50000"
DEMO_REQUIRE_GATEWAY_ASSERTION = "true"
ALLOWED_ORIGINS = "http://localhost:5175,http://127.0.0.1:5175,https://faithnet.me,https://www.faithnet.me,https://*.faithnet.me,https://gather27-web-faithnet.richardpedersen3.workers.dev,https://gather27-web-churchglobal.richardpedersen3.workers.dev,https://gamenight.faithnet.io,https://poker.faithnet.io"
# Spec 378 — a CLUB huddle. The card room names a member under the paired secret (`wrangler secret put
# CLUB_ROSTER_SECRET --env faithnet`, the same value on the card room) and reads a club workspace's roster under it;
# the standing itself is derived here from this Home's own records of the workspace, never asked of the card room.
MCP_URL = "https://mcp.faithnet.io"
# AKCS (Agentic Key Custody Service) — faithchain runs entirely on it; Base Sepolia stays on gcp-kms.
# Every key role moves together: the relayer signer, envelope wrap/unwrap, and — the one that would
# otherwise have been missed — per-subject OIDC custody (C_sub), which used to derive in-process from
# A2A_CUSTODY_ROOT_KEY no matter what this said.
#
# Under agentic-kms the derivation seed lives in the confidential VM, sealed by a Key Vault HSM root
# key, and never enters the Worker — which is the liability this migration removes: a custody master
# that could not be rotated, backed up, or recovered. That remains the destination for C_sub too; see
# the staged note on A2A_CUSTODY_KMS_BACKEND below for why it has not moved yet.
A2A_KMS_BACKEND = "agentic-kms"
# CUSTODY DERIVATION STAYS ON THE LEGACY ROOT (staged cutover — the reason this override exists).
#
# A person's KMS-custodied home IS a CREATE2 address over their derived custodian C_sub, so the
# derivation root can never move: a different root derives a different custodian, which is a
# different — empty — Smart Agent. AKCS is meant to hold the legacy master as its OIDC-custodian
# seed and run the identical `ap-oidc-custodian-secp256k1-v1` scheme; it does not yet, so every
# subject that existed before the cutover drifted. `assertSubjectSaStable` refused to route them
# (custody_root_changed, D-P0-1) — correctly — and their Homes were locked out of accounts that
# still exist and still hold their data.
#
# `A2A_CUSTODY_ROOT_KEY` is still a secret on this Worker, so pinning custody back to local-aes
# restores every existing member immediately. This is NOT a return to Google KMS: the root is an
# in-Worker secret. Everything else — relay signing, interactions-session, service MAC, vault KEKs —
# stays on AKCS. Remove this line once AKCS derives the same C_sub, proven with
# `scripts/verify-custody-derivation.mts` (MASTER + AKCS_TOKEN → MATCH) and not before: flipping it
# on a mismatched seed locks out every member again.
A2A_CUSTODY_KMS_BACKEND = "local-aes"
A2A_ALLOW_LOCAL_MASTER_KEY = "true"
AKCS_BASE_URL = "https://akcs-pilot.faithnet.io"
AKCS_TENANT_ID = "faithnet"
# The SIGNING key the relayer signs userOps with. Its address is 0xf9a98b25…f2c5 — new, and never used
# by the paymaster: faithnet's paymaster is in ALLOWLIST mode (verifyingSigner == address(0)), so a
# changed relayer address does not break sponsorship.
AKCS_RELAY_KEY_ID = "01a05f87-868f-7520-ab03-783fbc36aae4"
# The interactions-session signer — a DEDICATED key, never the relayer's. Its address
# (0xa6ed7ed0…c495) is the delegate inside every principal-signed DEL-001 session leaf, so sharing the
# relay key would make the relayer a delegate of every principal's interactions grant.
AKCS_INTERACTIONS_KEY_ID = "01a05fed-cc40-7e12-8558-0e8a0fa001df"
# AKCS_TOKEN is a SECRET (wrangler secret put), never a var — it is a bearer credential for the tenant.
PAYMASTER = "0xbd93fEC6910ffD74F14709188b5a9B6C6965b2a7"
PAYMASTER_VERIFYING_SIGNER = "0x89D13c596c45E4eE80Af5ae06C727FE9A820ffD0"
